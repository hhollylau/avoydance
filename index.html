<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="app-version" content="2026-02-12-1" />
  <title>Avoydance</title>
  <script>
    (function () {
      const versionMeta = document.querySelector('meta[name="app-version"]');
      const version = versionMeta ? versionMeta.content : String(Date.now());
      window.APP_VERSION = version;

      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = "styles.css?v=" + encodeURIComponent(version);
      document.head.appendChild(stylesheet);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="title">Avoydance</div>
    <div class="subtitle">unsent messages</div>
  </header>

  <main class="messages" id="messages"></main>

  <footer class="composer">
    <input id="input" type="text" placeholder="iMessage" autocomplete="off" />
    <button id="send" disabled aria-label="Send">↑</button>
  </footer>

  <div id="toast" class="toast hidden">Sent to the void.</div>

  <script>
    (function () {
      const script = document.createElement("script");
      script.src = "app.js?v=" + encodeURIComponent(window.APP_VERSION || String(Date.now()));
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
